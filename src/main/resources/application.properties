spring.application.name=FileUpload

# multipart configuration

# enabling multipart upload
spring.servlet.multipart.enabled=true
# max file size
spring.servlet.multipart.max-file-size=300MB
# threshold
spring.servlet.multipart.file-size-threshold=1KB


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fileupload_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
